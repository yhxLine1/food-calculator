<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日热量计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        h1 { text-align: center; margin-bottom: 10px; color: #2c3e50; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        /* Search Section */
        .search-section { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: border-color 0.3s; outline: none; }
        .search-box input:focus { border-color: #4facfe; }
        .search-box button { padding: 14px 28px; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
        .search-box button:hover { transform: scale(1.05); }

        /* Category Tabs */
        .category-tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
        .category-tab { padding: 8px 16px; border-radius: 20px; border: 2px solid #e0e0e0; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .category-tab:hover { border-color: #4facfe; }
        .category-tab.active { background: #4facfe; color: #fff; border-color: #4facfe; }

        /* Food Results */
        .food-results { max-height: 400px; overflow-y: auto; margin-top: 16px; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; border-radius: 8px; }
        .food-item:hover { background: #f8fbff; }
        .food-item:last-child { border-bottom: none; }
        .food-info { flex: 1; }
        .food-name { font-size: 16px; font-weight: 500; color: #2c3e50; }
        .food-meta { font-size: 12px; color: #999; margin-top: 4px; }
        .food-cal { font-size: 18px; font-weight: bold; color: #4facfe; margin-right: 12px; }
        .food-cal span { font-size: 12px; font-weight: normal; color: #999; }
        .add-btn { width: 36px; height: 36px; border-radius: 50%; background: #4facfe; color: #fff; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .add-btn:hover { transform: scale(1.1); }

        /* Daily Log */
        .daily-log { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .log-title { font-size: 18px; font-weight: 600; color: #2c3e50; }
        .total-cal { font-size: 28px; font-weight: bold; color: #4facfe; }
        .total-cal span { font-size: 14px; color: #999; font-weight: normal; }
        .goal-bar { background: #e0e0e0; border-radius: 10px; height: 12px; margin: 12px 0; overflow: hidden; }
        .goal-fill { height: 100%; background: linear-gradient(135deg, #4facfe, #00f2fe); border-radius: 10px; transition: width 0.5s; }

        .log-items { max-height: 300px; overflow-y: auto; }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .log-item:last-child { border-bottom: none; }
        .log-item-left { display: flex; align-items: center; gap: 12px; }
        .log-item-name { font-size: 15px; color: #333; }
        .log-item-amount { font-size: 12px; color: #999; }
        .log-item-cal { font-size: 16px; font-weight: 500; color: #555; }
        .log-item-del { width: 28px; height: 28px; border-radius: 50%; border: none; background: #ff6b6b; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; margin-left: 12px; transition: transform 0.2s; }
        .log-item-del:hover { transform: scale(1.1); }

        .empty-tip { text-align: center; color: #bbb; padding: 30px; font-size: 14px; }

        .clear-btn { background: none; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .clear-btn:hover { background: #ff6b6b; color: #fff; }

        /* Quantity Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 30px; width: 320px; text-align: center; }
        .modal h3 { margin-bottom: 20px; color: #2c3e50; }
        .modal input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 18px; text-align: center; outline: none; }
        .modal input:focus { border-color: #4facfe; }
        .modal-btns { display: flex; gap: 12px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
        .btn-confirm { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        .btn-cancel { background: #f0f0f0; color: #666; }

        .unit-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        .unit-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #e0e0e0; background: #fff; cursor: pointer; font-size: 13px; }
        .unit-btn.active { background: #4facfe; color: #fff; border-color: #4facfe; }

        /* Meal Tags */
        .meal-tags { display: flex; gap: 8px; margin-bottom: 16px; }
        .meal-tag { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 2px solid #e0e0e0; background: #fff; transition: all 0.3s; }
        .meal-tag.active { border-color: #4facfe; background: #4facfe; color: #fff; }

        /* Nutrient summary */
        .nutrient-summary { display: flex; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
        .nutrient-item { flex: 1; text-align: center; }
        .nutrient-val { font-size: 18px; font-weight: 600; color: #2c3e50; }
        .nutrient-label { font-size: 12px; color: #999; margin-top: 4px; }

        /* Settings Button */
        .settings-btn { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.12); font-size: 22px; cursor: pointer; z-index: 50; transition: transform 0.3s; }
        .settings-btn:hover { transform: rotate(30deg) scale(1.1); }

        /* Settings Modal */
        .settings-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .settings-modal.show { display: flex; }
        .settings-panel { background: #fff; border-radius: 20px; padding: 32px; width: 400px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
        .settings-panel h2 { margin-bottom: 24px; color: #2c3e50; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #4facfe; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .radio-group { display: flex; gap: 10px; }
        .radio-group label { flex: 1; text-align: center; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .radio-group input { display: none; }
        .radio-group input:checked + label { border-color: #4facfe; background: #4facfe; color: #fff; }
        .radio-group label:hover { border-color: #4facfe; }
        .calc-result { background: linear-gradient(135deg, #f0f9ff, #e0f7fa); border-radius: 12px; padding: 16px; margin: 16px 0; }
        .calc-result h4 { font-size: 14px; color: #2c3e50; margin-bottom: 10px; }
        .calc-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .calc-row .val { font-weight: bold; color: #4facfe; }
        .settings-btns { display: flex; gap: 12px; margin-top: 24px; }
        .settings-btns button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; }
        .btn-apply { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        .btn-close-settings { background: #f0f0f0; color: #666; }

        /* Goal bars */
        .goal-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
        .goal-section-title { font-size: 14px; font-weight: 600; color: #2c3e50; margin-bottom: 12px; }
        .macro-bar-row { margin-bottom: 10px; }
        .macro-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }
        .macro-bar-label .target { color: #999; }
        .macro-bar { background: #e0e0e0; border-radius: 6px; height: 8px; overflow: hidden; }
        .macro-bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
        .macro-bar-fill.protein { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .macro-bar-fill.carb { background: linear-gradient(90deg, #4facfe, #00f2fe); }
        .macro-bar-fill.fat { background: linear-gradient(90deg, #fa709a, #fee140); }

    </style>
</head>
<body>
<button class="settings-btn" onclick="openSettings()" title="身体参数设置">⚙️</button>
<div class="container">
    <h1>🍽️ 每日热量计算器</h1>
    <p class="subtitle">搜索食物，快速记录每日摄入热量</p>

    <div class="search-section">
        <div class="category-tabs" id="categoryTabs">
            <div class="category-tab active" data-cat="all">全部</div>
            <div class="category-tab" data-cat="grain">主食</div>
            <div class="category-tab" data-cat="meat">肉类</div>
            <div class="category-tab" data-cat="veggie">蔬菜</div>
            <div class="category-tab" data-cat="soup">汤粥</div>
            <div class="category-tab" data-cat="egg">蛋类</div>
            <div class="category-tab" data-cat="soy">豆制品</div>
            <div class="category-tab" data-cat="drink">饮品</div>
            <div class="category-tab" data-cat="fruit">水果</div>
            <div class="category-tab" data-cat="snack">零食</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索食物名称，如：鸡腿饭、鸡蛋...">
            <button onclick="searchFood()">搜索</button>
        </div>
        <div class="food-results" id="foodResults">
            <div class="empty-tip">输入食物名称搜索，或点击上方分类浏览</div>
        </div>
    </div>

    <div class="daily-log">
        <div class="log-header">
            <span class="log-title">今日饮食记录</span>
            <span class="total-cal" id="totalCal">0 <span>kcal</span></span>
        </div>
        <div class="goal-bar">
            <div class="goal-fill" id="goalFill" style="width:0%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:8px;">
            <span>目标：2000 kcal</span>
            <span id="remainCal">剩余 2000 kcal</span>
        </div>
        <div class="log-items" id="logItems">
            <div class="empty-tip">还没有记录，去添加食物吧</div>
        </div>
        <div class="nutrient-summary">
            <div class="nutrient-item"><div class="nutrient-val" id="nutProtein">0g</div><div class="nutrient-label">蛋白质</div></div>
            <div class="nutrient-item"><div class="nutrient-val" id="nutCarb">0g</div><div class="nutrient-label">碳水</div></div>
            <div class="nutrient-item"><div class="nutrient-val" id="nutFat">0g</div><div class="nutrient-label">脂肪</div></div>
            <div class="nutrient-item"><div class="nutrient-val" id="nutCount">0份</div><div class="nutrient-label">食物数</div></div>
        </div>
        <div class="goal-section">
            <div class="goal-section-title">宏量营养素目标</div>
            <div class="macro-bar-row">
                <div class="macro-bar-label"><span>蛋白质</span><span class="target" id="macroProteinTarget">0g / 120g</span></div>
                <div class="macro-bar"><div class="macro-bar-fill protein" id="macroProtein" style="width:0%"></div></div>
            </div>
            <div class="macro-bar-row">
                <div class="macro-bar-label"><span>碳水化合物</span><span class="target" id="macroCarbTarget">0g / 250g</span></div>
                <div class="macro-bar"><div class="macro-bar-fill carb" id="macroCarb" style="width:0%"></div></div>
            </div>
            <div class="macro-bar-row">
                <div class="macro-bar-label"><span>脂肪</span><span class="target" id="macroFatTarget">0g / 65g</span></div>
                <div class="macro-bar"><div class="macro-bar-fill fat" id="macroFat" style="width:0%"></div></div>
            </div>
        </div>
        <div style="margin-top:16px;text-align:right;">
            <button class="clear-btn" onclick="clearAll()">清空全部</button>
        </div>
    </div>
</div>

<!-- Quantity Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalFoodName">添加食物</h3>
        <p style="color:#999;font-size:13px;margin-bottom:12px;">1份 = <span id="modalRefServing">100g</span></p>
        <input type="number" id="modalQty" value="1" min="0.5" step="0.5">
        <div class="unit-btns">
            <button class="unit-btn active" data-multi="1">份</button>
            <button class="unit-btn" data-multi="0.5">半份</button>
            <button class="unit-btn" data-multi="2">2份</button>
            <button class="unit-btn" data-multi="3">3份</button>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" onclick="confirmAdd()">添加</button>
        </div>
    </div>
</div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-panel">
            <h2>📊 身体参数与目标</h2>
            <div class="form-group">
                <label>性别</label>
                <div class="radio-group">
                    <input type="radio" name="gender" id="male" value="male" checked>
                    <label for="male">男</label>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">女</label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>年龄（岁）</label>
                    <input type="number" id="age" value="25" min="10" max="100">
                </div>
                <div class="form-group">
                    <label>身高（cm）</label>
                    <input type="number" id="height" value="170" min="100" max="250">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>体重（kg）</label>
                    <input type="number" id="weight" value="65" min="30" max="300" step="0.1">
                </div>
                <div class="form-group">
                    <label>活动量</label>
                    <select id="activity">
                        <option value="1.2">久坐（少运动）</option>
                        <option value="1.375" selected>轻度活动（每周1-3天）</option>
                        <option value="1.55">中度活动（每周3-5天）</option>
                        <option value="1.725">高度活动（每周6-7天）</option>
                        <option value="1.9">运动员（每天2次）</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>目标</label>
                <div class="radio-group">
                    <input type="radio" name="goal" id="goal_loose" value="lose">
                    <label for="goal_loose">减脂 🔥</label>
                    <input type="radio" name="goal" id="goal_maintain" value="maintain" checked>
                    <label for="goal_maintain">保持 ⚖️</label>
                    <input type="radio" name="goal" id="goal_gain" value="gain">
                    <label for="goal_gain">增肌 💪</label>
                </div>
            </div>
            <div class="calc-result" id="calcResult">
                <h4>计算结果</h4>
                <div class="calc-row"><span>基础代谢（BMR）</span><span class="val" id="resBmr">—</span></div>
                <div class="calc-row"><span>每日消耗（TDEE）</span><span class="val" id="resTdee">—</span></div>
                <div class="calc-row"><span>建议摄入热量</span><span class="val" id="resCal">—</span></div>
                <div class="calc-row"><span>蛋白质目标</span><span class="val" id="resProtein">—</span></div>
                <div class="calc-row"><span>碳水目标</span><span class="val" id="resCarb">—</span></div>
                <div class="calc-row"><span>脂肪目标</span><span class="val" id="resFat">—</span></div>
            </div>
            <div class="settings-btns">
                <button class="btn-close-settings" onclick="closeSettings()">取消</button>
                <button class="btn-apply" onclick="applySettings()">应用设置</button>
            </div>
        </div>
    </div>

// ===== 状态管理 =====
let log = [];
let currentFood = null;
let currentMultiplier = 1;

// 目标设置（默认值）
let dailyGoal = {
    cal: 2000,
    protein: 120,
    carb: 250,
    fat: 65
};

// ===== 搜索 =====
function searchFood() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const cat = document.querySelector('.category-tab.active').dataset.cat;
    let results = FOOD_DB.filter(f => {
        const matchName = f.name.toLowerCase().includes(q);
        const matchCat = cat === 'all' || f.cat === cat;
        return matchName && matchCat;
    });
    renderResults(results);
}

function renderResults(foods) {
    const el = document.getElementById('foodResults');
    if (!foods.length) {
        el.innerHTML = '<div class="empty-tip">没有找到相关食物，试试其他关键词</div>';
        return;
    }
    el.innerHTML = foods.map((f, i) => `
        <div class="food-item" onclick="openModal(${FOOD_DB.indexOf(f)})">
            <div class="food-info">
                <div class="food-name">${f.name}</div>
                <div class="food-meta">${f.serving} · 蛋白质${f.protein}g · 碳水${f.carb}g · 脂肪${f.fat}g</div>
            </div>
            <div class="food-cal">${Math.round(f.cal)}<span> kcal</span></div>
            <button class="add-btn" onclick="event.stopPropagation();openModal(${FOOD_DB.indexOf(f)})">+</button>
        </div>
    `).join('');
}

// ===== 分类切换 =====
document.querySelectorAll('.category-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        searchFood();
    });
});

// ===== 回车搜索 =====
document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchFood();
});

// ===== 弹窗 =====
function openModal(idx) {
    currentFood = FOOD_DB[idx];
    currentMultiplier = 1;
    document.getElementById('modalFoodName').textContent = currentFood.name;
    document.getElementById('modalRefServing').textContent = currentFood.serving;
    document.getElementById('modalQty').value = 1;
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.unit-btn[data-multi="1"]').classList.add('active');
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

document.querySelectorAll('.unit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMultiplier = parseFloat(btn.dataset.multi);
        document.getElementById('modalQty').value = currentMultiplier;
    });
});

function confirmAdd() {
    const qty = parseFloat(document.getElementById('modalQty').value) || 1;
    const totalCal = Math.round(currentFood.cal * qty);
    const totalProtein = +(currentFood.protein * qty).toFixed(1);
    const totalCarb = +(currentFood.carb * qty).toFixed(1);
    const totalFat = +(currentFood.fat * qty).toFixed(1);

    log.push({
        name: currentFood.name,
        cal: totalCal,
        protein: totalProtein,
        carb: totalCarb,
        fat: totalFat,
        qty: qty,
        serving: currentFood.serving
    });

    closeModal();
    renderLog();
}

// ===== 渲染记录 =====
function renderLog() {
    const el = document.getElementById('logItems');
    if (!log.length) {
        el.innerHTML = '<div class="empty-tip">还没有记录，去添加食物吧</div>';
        updateSummary(0, 0, 0, 0);
        return;
    }
    el.innerHTML = log.map((item, i) => `
        <div class="log-item">
            <div class="log-item-left">
                <div>
                    <div class="log-item-name">${item.name}</div>
                    <div class="log-item-amount">${item.qty}份</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;">
                <div class="log-item-cal">${item.cal} kcal</div>
                <button class="log-item-del" onclick="removeItem(${i})">×</button>
            </div>
        </div>
    `).join('');
    updateSummary();
}

function updateSummary() {
    const total = log.reduce((s, i) => s + i.cal, 0);
    const totalP = log.reduce((s, i) => s + i.protein, 0);
    const totalC = log.reduce((s, i) => s + i.carb, 0);
    const totalF = log.reduce((s, i) => s + i.fat, 0);
    document.getElementById('totalCal').innerHTML = total + ' <span>kcal</span>';
    document.getElementById('goalFill').style.width = Math.min(total / dailyGoal.cal * 100, 100) + '%';
    document.getElementById('remainCal').textContent = '剩余 ' + Math.max(dailyGoal.cal - total, 0) + ' kcal';
    document.getElementById('nutProtein').textContent = totalP.toFixed(1) + 'g';
    document.getElementById('nutCarb').textContent = totalC.toFixed(1) + 'g';
    document.getElementById('nutFat').textContent = totalF.toFixed(1) + 'g';
    document.getElementById('nutCount').textContent = log.length + '份';

    // 宏量营养素目标进度条
    const pBar = document.getElementById('macroProtein');
    const cBar = document.getElementById('macroCarb');
    const fBar = document.getElementById('macroFat');
    if (pBar) {
        pBar.style.width = Math.min(totalP / dailyGoal.protein * 100, 100) + '%';
        document.getElementById('macroProteinTarget').textContent = totalP.toFixed(1) + 'g / ' + dailyGoal.protein + 'g';
        cBar.style.width = Math.min(totalC / dailyGoal.carb * 100, 100) + '%';
        document.getElementById('macroCarbTarget').textContent = totalC.toFixed(1) + 'g / ' + dailyGoal.carb + 'g';
        fBar.style.width = Math.min(totalF / dailyGoal.fat * 100, 100) + '%';
        document.getElementById('macroFatTarget').textContent = totalF.toFixed(1) + 'g / ' + dailyGoal.fat + 'g';
    }
}

function removeItem(i) {
    log.splice(i, 1);
    renderLog();
}

function clearAll() {
    if (!confirm('确定清空全部记录？')) return;
    log = [];
    renderLog();
}

// ===== 设置弹窗 =====
function openSettings() {
    const saved = localStorage.getItem('nutriGoal');
    if (saved) {
        const s = JSON.parse(saved);
        document.getElementById('age').value = s.age || 25;
        document.getElementById('height').value = s.height || 170;
        document.getElementById('weight').value = s.weight || 65;
        document.getElementById('activity').value = s.activity || '1.375';
        document.querySelector('input[name="gender"][value="' + (s.gender || 'male') + '"]').checked = true;
        document.querySelector('input[name="goal"][value="' + (s.goal || 'maintain') + '"]').checked = true;
    }
    calcPreview();
    document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('show');
}

function calcPreview() {
    const gender = document.querySelector('input[name="gender"]:checked').value;
    const age = parseInt(document.getElementById('age').value) || 25;
    const height = parseInt(document.getElementById('height').value) || 170;
    const weight = parseFloat(document.getElementById('weight').value) || 65;
    const activity = parseFloat(document.getElementById('activity').value) || 1.375;
    const goal = document.querySelector('input[name="goal"]:checked').value;

    // Mifflin-St Jeor BMR公式
    let bmr;
    if (gender === 'male') {
        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
    }
    const tdee = Math.round(bmr * activity);

    // 目标热量调整
    let cal;
    if (goal === 'lose') cal = tdee - 500;
    else if (goal === 'gain') cal = tdee + 300;
    else cal = tdee;

    // 宏量营养素分配比例
    let proteinRatio, carbRatio, fatRatio;
    if (goal === 'lose') {
        proteinRatio = 0.35; carbRatio = 0.35; fatRatio = 0.30;
    } else if (goal === 'gain') {
        proteinRatio = 0.30; carbRatio = 0.45; fatRatio = 0.25;
    } else {
        proteinRatio = 0.25; carbRatio = 0.45; fatRatio = 0.30;
    }

    const protein = Math.round(cal * proteinRatio / 4);
    const carb = Math.round(cal * carbRatio / 4);
    const fat = Math.round(cal * fatRatio / 9);

    document.getElementById('resBmr').textContent = Math.round(bmr) + ' kcal';
    document.getElementById('resTdee').textContent = tdee + ' kcal';
    document.getElementById('resCal').textContent = cal + ' kcal';
    document.getElementById('resProtein').textContent = protein + 'g';
    document.getElementById('resCarb').textContent = carb + 'g';
    document.getElementById('resFat').textContent = fat + 'g';
}

function applySettings() {
    const goal = document.querySelector('input[name="goal"]:checked').value;
    const weight = parseFloat(document.getElementById('weight').value) || 65;

    // 重新计算
    calcPreview();
    dailyGoal.cal = parseInt(document.getElementById('resCal').textContent);
    dailyGoal.protein = parseInt(document.getElementById('resProtein').textContent);
    dailyGoal.carb = parseInt(document.getElementById('resCarb').textContent);
    dailyGoal.fat = parseInt(document.getElementById('resFat').textContent);

    // 保存设置
    const settings = {
        gender: document.querySelector('input[name="gender"]:checked').value,
        age: parseInt(document.getElementById('age').value),
        height: parseInt(document.getElementById('height').value),
        weight: weight,
        activity: document.getElementById('activity').value,
        goal: goal,
        cal: dailyGoal.cal,
        protein: dailyGoal.protein,
        carb: dailyGoal.carb,
        fat: dailyGoal.fat
    };
    localStorage.setItem('nutriGoal', JSON.stringify(settings));

    closeSettings();
    renderLog();
}

// 监听设置弹窗输入，实时预览
document.querySelectorAll('#settingsModal input, #settingsModal select').forEach(el => {
    el.addEventListener('input', calcPreview);
    el.addEventListener('change', calcPreview);
});


// 加载已保存的设置
(function loadSettings() {
    const saved = localStorage.getItem('nutriGoal');
    if (saved) {
        const s = JSON.parse(saved);
        dailyGoal = { cal: s.cal || 2000, protein: s.protein || 120, carb: s.carb || 250, fat: s.fat || 65 };
    }
    renderLog();
    renderResults(FOOD_DB.slice(0, 30));
})();
</script>
