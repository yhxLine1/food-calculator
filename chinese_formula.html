<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中药方剂解析器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

  :root {
    --linen: #f5f0e8;
    --linen-dark: #e8e0d0;
    --brown: #8b6914;
    --brown-light: #a67c2e;
    --brown-dark: #6b4f10;
    --gray-dark: #3a3a3a;
    --gray-mid: #6b6b6b;
    --gray-light: #9a9a9a;
    --ink: #2c2418;
    --paper: #faf7f0;
    --accent: #c0392b;
    --accent-soft: #e74c3c;
    --shadow: rgba(44, 36, 24, 0.1);
    --shadow-md: rgba(44, 36, 24, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--linen);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(139,105,20,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(139,105,20,0.03) 0%, transparent 50%);
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--ink) 0%, #4a3f2f 100%);
    color: var(--linen);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.5;
  }
  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 6px;
    position: relative;
    margin-bottom: 8px;
  }
  .header h1::before { content: '☯ '; font-size: 22px; }
  .header h1::after { content: ' ☯'; font-size: 22px; }
  .header .subtitle {
    font-size: 13px;
    color: rgba(245,240,232,0.6);
    letter-spacing: 3px;
    position: relative;
  }

  /* Container */
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Input Section */
  .input-section {
    background: var(--paper);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px var(--shadow);
    border: 1px solid var(--linen-dark);
  }
  .section-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 16px;
    background: var(--brown);
    border-radius: 2px;
  }
  .input-hint {
    font-size: 12px;
    color: var(--gray-light);
    margin-bottom: 10px;
    padding-left: 12px;
  }
  textarea {
    width: 100%;
    height: 130px;
    border: 2px solid var(--linen-dark);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink);
    background: var(--linen);
    resize: vertical;
    transition: border-color 0.3s, box-shadow 0.3s;
    line-height: 1.8;
  }
  textarea:focus {
    outline: none;
    border-color: var(--brown-light);
    box-shadow: 0 0 0 3px rgba(139,105,20,0.1);
  }
  textarea::placeholder { color: var(--gray-light); }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
    color: var(--linen);
    box-shadow: 0 4px 12px rgba(139,105,20,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139,105,20,0.4);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: var(--linen);
    color: var(--gray-mid);
    border: 2px solid var(--linen-dark);
  }
  .btn-secondary:hover {
    border-color: var(--brown-light);
    color: var(--brown-dark);
  }

  /* Parsed Results */
  .parsed-section {
    background: var(--paper);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px var(--shadow);
    border: 1px solid var(--linen-dark);
    display: none;
  }
  .parsed-section.show { display: block; }

  .herb-list {
    display: grid;
    gap: 8px;
  }
  .herb-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--linen);
    border-radius: 10px;
    border: 1px solid var(--linen-dark);
    transition: all 0.2s;
  }
  .herb-item:hover {
    border-color: var(--brown-light);
    box-shadow: 0 2px 8px var(--shadow);
  }
  .herb-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }
  .herb-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--gray-mid);
  }
  .herb-dosage {
    background: var(--brown);
    color: var(--linen);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .herb-nature {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }
  .nature-warm { background: #fef3c7; color: #92400e; }
  .nature-hot { background: #fee2e2; color: #991b1b; }
  .nature-cold { background: #dbeafe; color: #1e40af; }
  .nature-cool { background: #d1fae5; color: #065f46; }
  .nature-neutral { background: #f3f4f6; color: #4b5563; }

  /* Analysis Result */
  .result-section {
    background: var(--paper);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px var(--shadow);
    border: 1px solid var(--linen-dark);
    display: none;
    animation: fadeIn 0.5s ease;
  }
  .result-section.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .formula-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--linen-dark);
  }
  .formula-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .formula-name::before, .formula-name::after {
    content: '——';
    font-size: 16px;
    color: var(--brown-light);
    margin: 0 8px;
  }
  .formula-efficacy {
    font-size: 14px;
    color: var(--brown-dark);
    background: rgba(139,105,20,0.08);
    display: inline-block;
    padding: 6px 20px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  .result-body {
    display: grid;
    gap: 16px;
  }
  .result-card {
    background: var(--linen);
    border-radius: 12px;
    padding: 18px 20px;
    border-left: 4px solid var(--brown);
  }
  .result-card-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-card-title .icon {
    width: 24px;
    height: 24px;
    background: var(--brown);
    color: var(--linen);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .result-card p {
    font-size: 14px;
    line-height: 1.9;
    color: var(--gray-dark);
    padding-left: 32px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--gray-light);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-light);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Responsive */
  @media (max-width: 600px) {
    .header h1 { font-size: 22px; letter-spacing: 4px; }
    .container { padding: 16px 12px 40px; }
    .input-section, .parsed-section, .result-section { padding: 18px; }
    .formula-name { font-size: 22px; }
    .formula-name::before, .formula-name::after { display: none; }
    .btn { padding: 12px 16px; font-size: 14px; }
    .herb-item { padding: 10px 12px; }
    .herb-name { font-size: 15px; }
    .result-card p { padding-left: 0; }
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(245,240,232,0.4);
    border-top-color: var(--linen);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>智能中药方剂解析器</h1>
  <div class="subtitle">基于中药学理论 · 君臣佐使 · 性味归经</div>
</div>

<div class="container">
  <!-- Input -->
  <div class="input-section">
    <div class="section-label">方剂输入</div>

    <textarea id="inputText" placeholder="例如：黄芪 15g，当归 10g，白术 12g，茯苓 15g，甘草 6g，川芎 10g，赤芍 12g"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="analyzeFormula()">解析方剂</button>
      <button class="btn btn-secondary" onclick="clearAll()">清空</button>
    </div>
  </div>

  <!-- Parsed Herbs -->
  <div class="parsed-section" id="parsedSection">
    <div class="section-label">药材清单</div>
    <div class="herb-list" id="herbList"></div>
  </div>

  <!-- Result -->
  <div class="result-section" id="resultSection">
    <div class="formula-header">
      <div class="formula-name" id="formulaName"></div>
      <div class="formula-efficacy" id="formulaEfficacy"></div>
    </div>
    <div class="result-body" id="resultBody"></div>
  </div>

  <div class="footer">
    本工具仅供学习参考，不构成医疗建议。用药请遵医嘱。
  </div>
</div>

// ==================== 解析引擎 ====================
function parseInput(text) {
  const herbs = [];
  // Match patterns like: 黄芪 15g, 当归10g, 白术 12克, 人参(15g)
  const patterns = [
    /([一-龥]{1,4})\s*(\d+\.?\d*)\s*(g|克|g\.)\s*[,，；;、\s]*/g,
    /([一-龥]{1,4})\s*\((\d+\.?\d*)\s*(g|克)\)/g,
  ];

  let matched = {};
  patterns.forEach(pat => {
    let m;
    while ((m = pat.exec(text)) !== null) {
      const name = m[1].trim();
      const dose = parseFloat(m[2]);
      if (HERB_DB[name] && dose > 0) {
        matched[name] = dose;
      }
    }
  });

  // Also try simple name matching for known herbs
  Object.keys(HERB_DB).forEach(herbName => {
    const regex = new RegExp(herbName + '\\s*(\\d+\\.?\\d*)\\s*(g|克)?', 'g');
    let m;
    while ((m = regex.exec(text)) !== null) {
      const dose = parseFloat(m[1]) || 10; // default 10g if no dose
      if (!matched[herbName] || dose > matched[herbName]) {
        matched[herbName] = dose;
      }
    }
  });

  // Build result
  for (const [name, dose] of Object.entries(matched)) {
    herbs.push({ name, dose, ...HERB_DB[name] });
  }

  // Sort by dose descending (君药在前)
  herbs.sort((a, b) => b.dose - a.dose);
  return herbs;
}

// ==================== 方义生成引擎 ====================
function generateFormulaAnalysis(herbs) {
  if (herbs.length === 0) return null;

  // 1. Categorize herbs by group
  const groups = {};
  herbs.forEach(h => {
    if (!groups[h.group]) groups[h.group] = [];
    groups[h.group].push(h);
  });

  // 2. Determine dominant therapeutic direction
  const groupNames = Object.keys(groups);
  const groupDoses = groupNames.map(g => ({
    group: g,
    totalDose: groups[g].reduce((s, h) => s + h.dose, 0),
    herbs: groups[g]
  }));
  groupDoses.sort((a, b) => b.totalDose - a.totalDose);

  const primaryGroup = groupDoses[0];
  const secondaryGroup = groupDoses[1];

  // 3. Generate formula name
  const formulaName = generateFormulaName(herbs, primaryGroup, secondaryGroup);

  // 4. Determine overall efficacy
  const overallEfficacy = generateOverallEfficacy(herbs, primaryGroup, secondaryGroup);

  // 5. Generate 君臣佐使 analysis
  const junChenZuoShi = generateJunChenZuoShi(herbs, primaryGroup, secondaryGroup);

  // 6. Generate detailed analysis
  const detailedAnalysis = generateDetailedAnalysis(herbs, groups, primaryGroup, secondaryGroup);

  // 7. Generate overall formula commentary (80-120字)
  const formulaComment = generateFormulaComment(herbs, primaryGroup, secondaryGroup, junChenZuoShi);

  // 8. Generate warning
  const warning = generateWarning(herbs);

  return {
    name: formulaName,
    efficacy: overallEfficacy,
    junChenZuoShi,
    detailed: detailedAnalysis,
    comment: formulaComment,
    warning
  };
}

function generateFormulaName(herbs, primary, secondary) {
  const primaryNames = primary.herbs.map(h => h.name);
  const secondaryNames = secondary ? secondary.herbs.map(h => h.name) : [];

  // Extract key characters
  const getKey = (name) => {
    if (name.length >= 2) return name.slice(-1);
    return name;
  };

  // Generate name based on groups
  const groupSuffixes = {
    '补气': '益气',
    '补血': '养血',
    '补阳': '温阳',
    '补阴': '滋阴',
    '清热': '清热',
    '泻下': '泻下',
    '理气': '行气',
    '活血': '活血',
    '解表': '解表',
    '祛风湿': '祛风',
    '化湿': '化湿',
    '利水': '利水',
    '温里': '温里',
    '安神': '安神',
    '开窍': '开窍',
    '平肝': '平肝',
    '化痰': '化痰',
    '收涩': '固涩',
    '消食': '消食'
  };

  const suffix = groupSuffixes[primary.group] || '方';

  // Take first character of first two herbs
  const n1 = getKey(primaryNames[0]);
  const n2 = secondaryNames.length > 0 ? getKey(secondaryNames[0]) : getKey(primaryNames[1] || primaryNames[0]);

  // Try to make a meaningful name
  const candidates = [
    `${n1}${n2}${suffix}`,
    `${primaryNames[0]}${n2}${suffix}`,
  ];

  // Prefer 2-character names for elegance
  if (candidates[0].length > 4) {
    return candidates[1];
  }
  return candidates[0];
}

  const groupActions = {

    '消食': '消食导滞'
  };

  const actions = [];
  actions.push(groupActions[primary.group] || primary.group);
  if (secondary && secondary.group !== primary.group) {
    actions.push(groupActions[secondary.group] || secondary.group);
  }

  // Check for specific herb combinations that suggest specific effects
  const herbNames = herbs.map(h => h.name);

  if (herbNames.includes('黄芪') && herbNames.includes('当归')) {

  if (herbNames.includes('人参') && herbNames.includes('麦冬') && herbNames.includes('五味子')) {
    return '益气养阴，生津敛汗';
  }
  if (herbNames.includes('柴胡') && herbNames.includes('白芍')) {
    return '疏肝解郁，柔肝止痛';
  }
  if (herbNames.includes('川芎') && herbNames.includes('桃仁') && herbNames.includes('红花')) {

  }

function generateJunChenZuoShi(herbs, primary, secondary) {
  const sorted = [...herbs].sort((a, b) => b.dose - a.dose);
  const totalDose = sorted.reduce((s, h) => s + h.dose, 0);

  // Jun (君药): 剂量最大，或主要功效的药材
  const junHerbs = sorted.filter(h => h.dose >= sorted[0].dose * 0.8).slice(0, 2);

  // Chen (臣药): 辅助君药，或次要功效的药材
  const chenHerbs = sorted.filter(h =>
    !junHerbs.includes(h) && (h.dose >= sorted[1].dose * 0.6 ||
    (primary.herbs.includes(h) && !junHerbs.includes(h)))
  ).slice(0, 2);

  // Zuo (佐药): 佐助佐制
  const zuoHerbs = sorted.filter(h => !junHerbs.includes(h) && !chenHerbs.includes(h)).slice(0, 2);

  // Shi (使药): 调和
  const shiHerbs = sorted.filter(h => !junHerbs.includes(h) && !chenHerbs.includes(h) && !zuoHerbs.includes(h));

  return {
    jun: { herbs: junHerbs, desc: generateJunDesc(junHerbs, primary) },
    chen: { herbs: chenHerbs, desc: generateChenDesc(chenHerbs, secondary) },
    zuo: { herbs: zuoHerbs, desc: generateZuoDesc(zuoHerbs) },
    shi: { herbs: shiHerbs, desc: generateShiDesc(shiHerbs) }
  };
}

function generateJunDesc(junHerbs, primaryGroup) {
  if (junHerbs.length === 0) return '无人参为君';
  const names = junHerbs.map(h => h.name).join('、');
  const action = junHerbs.map(h => h.功效.split('，')[0]).join('、');
  return `${names}为君药，${action}，针对主证起主要治疗作用。`;
}

function generateChenDesc(chenHerbs, secondaryGroup) {
  if (chenHerbs.length === 0) return '无臣药。';
  const names = chenHerbs.map(h => h.name).join('、');
  if (secondaryGroup) {
    return `${names}为臣药，${secondaryGroup.herbs[0]?.功效.split('，')[0] || '辅助君药'}，兼治兼证。`;
  }
  return `${names}为臣药，辅助君药增强疗效。`;
}

function generateZuoDesc(zuoHerbs) {
  if (zuoHerbs.length === 0) return '无佐药。';
  const names = zuoHerbs.map(h => h.name).join('、');
  return `${names}为佐药，佐助佐制，调和药性。`;
}

function generateShiDesc(shiHerbs) {
  if (shiHerbs.length === 0) return '无使药。';
  const names = shiHerbs.map(h => h.name).join('、');

function generateDetailedAnalysis(herbs, groups, primary, secondary) {
  const analysis = [];

  // Primary group analysis
  const primaryNames = primary.herbs.map(h => h.name).join('、');
  const primaryActions = primary.herbs.map(h => h.功效).join('；');
  analysis.push({
    title: '主攻方向',
    content: `${primaryNames}为主，${primaryActions}，针对${getTargetOrgans(primary.herbs)}起到${getPrimaryAction(primary)}作用。`
  });

  // Secondary group analysis
  if (secondary && secondary.herbs.length > 0) {
    const secondaryNames = secondary.herbs.map(h => h.name).join('、');
    analysis.push({
      title: '兼顾方向',
      content: `${secondaryNames}为辅，${secondary.herbs[0]?.功效.split('，')[0]}，标本兼顾。`
    });
  }

  // Herb property analysis
  const natures = {};
  herbs.forEach(h => { natures[h.nature] = (natures[h.nature] || 0) + 1; });
  const dominantNature = Object.entries(natures).sort((a, b) => b[1] - a[1])[0];

  // Flavor analysis
  const flavors = {};
  herbs.forEach(h => { flavors[h.flavor] = (flavors[h.flavor] || 0) + 1; });
  const dominantFlavor = Object.entries(flavors).sort((a, b) => b[1] - a[1])[0];

  analysis.push({
    title: '性味分析',
    content: `全方性${dominantNature ? dominantNature[0] : '平'}，味${dominantFlavor ? dominantFlavor[0] : '甘'}。${getNatureFlavorAnalysis(natures, flavors)}。`
  });

  // Meridian tropism
  const meridians = {};
  herbs.forEach(h => h.meridians.forEach(m => { meridians[m] = (meridians[m] || 0) + 1; }));
  const topMeridians = Object.entries(meridians).sort((a, b) => b[1] - a[1]).slice(0, 2);
  if (topMeridians.length > 0) {
    analysis.push({
      title: '归经分析',
      content: `本方主要归${topMeridians.map(([m]) => m + '经').join('、')}经，${getMeridianAnalysis(topMeridians, herbs)}.`
    });
  }

  // Synergy
  analysis.push({
    title: '配伍特点',
    content: generateSynergyText(herbs, groups, primary, secondary)
  });

  return analysis;
}

function getTargetOrgans(herbs) {
  const allMeridians = herbs.flatMap(h => h.meridians);
  const counts = {};
  allMeridians.forEach(m => counts[m] = (counts[m] || 0) + 1);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 2);
  return top.map(([m]) => m + '经').join('、');
}

  const dominantNature = Object.entries(natures).sort((a, b) => b[1] - a[1])[0];
  if (dominantNature[0] === '寒' || dominantNature[0] === '微寒') {
    parts.push('寒者热之，本方偏寒凉以清热');
  } else if (dominantNature[0] === '温' || dominantNature[0] === '热') {
    parts.push('寒者热之，本方偏温热以散寒');
  } else {
    parts.push('药性平和，不偏不倚');
  }

  const dominantFlavor = Object.entries(flavors).sort((a, b) => b[1] - a[1])[0];
  if (dominantFlavor && dominantFlavor[0].includes('甘')) {
    parts.push('甘能补能和能缓，以扶正为主');
  } else if (dominantFlavor && dominantFlavor[0].includes('苦')) {
    parts.push('苦能泄能燥能坚，以泻实为主');
  } else if (dominantFlavor && dominantFlavor[0].includes('辛')) {
    parts.push('辛能散能行，以行散为主');
  }
  return parts.join('，');
}

function getMeridianAnalysis(topMeridians, herbs) {
  const [m1] = topMeridians;
  if (m1 === '脾' || m1 === '胃') return '脾胃为后天之本，本方重在调理中焦，固护后天。';
  if (m1 === '肝' || m1 === '胆') return '肝胆主疏泄，本方重在调畅气机，疏肝利胆。';
  if (m1 === '肺') return '肺主气司呼吸，本方重在宣降肺气，调理气机。';
  if (m1 === '肾') return '肾为先天之本，本方重在培补根本，益精填髓。';
  if (m1 === '心') return '心主血脉神明，本方重在养心安神，调理血脉。';
  return '本方多经同调，气血兼顾。';
}

    [{ a: '金银花', b: '连翘' }, '金银花配连翘，清热解毒，疏散风热'],
    [{ a: '党参', b: '白术' }, '党参配白术，健脾益气，补后天之本'],
    [{ a: '人参', b: '麦冬' }, '人参配麦冬，益气养阴，生津止渴'],
    [{ a: '酸枣仁', b: '柏子仁' }, '酸枣仁配柏子仁，养心安神，润肠通便'],
    [{ a: '天麻', b: '钩藤' }, '天麻配钩藤，平肝息风，清热止痉'],
    [{ a: '丹参', b: '川芎' }, '丹参配川芎，活血祛瘀，通经止痛'],
    [{ a: '白术', b: '甘草' }, '白术配甘草，健脾益气，和中缓急'],
    [{ a: '茯苓', b: '甘草' }, '茯苓配甘草，健脾渗湿，调和诸药'],
  ];

  pairings.forEach(({ a, b }, desc) => {
    if (herbNames.includes(a) && herbNames.includes(b)) {
      parts.push(desc);
    }
  });

  // General synergy
  if (parts.length === 0) {
    const actions = herbs.slice(0, 3).map(h => h.功效.split('，')[0]);

function generateWarning(herbs) {
  const herbNames = herbs.map(h => h.name);
  const warnings = [];

  // Check for toxic herbs
  const toxicHerbs = ['附子', '川乌', '草乌', '马钱子', '斑蝥', '蟾酥', '巴豆', '天仙子', '洋金花'];
  const foundToxic = herbNames.filter(n => toxicHerbs.includes(n));
  if (foundToxic.length > 0) {
    warnings.push(`含${foundToxic.join('、')}等有毒药材，需谨慎使用，宜在医师指导下应用。`);
  }

  // Check for strong herbs
  if (herbNames.includes('大黄') || herbNames.includes('芒硝')) {
    warnings.push('含泻下药，脾胃虚弱者慎用，中病即止。');
  }
  if (herbNames.includes('桃仁') && herbNames.includes('红花')) {
    warnings.push('活血化瘀力强，孕妇慎用。');
  }

  return warnings.length > 0 ? warnings.join(' ') : '本方药性平和，建议在中医师辨证指导下使用。';
}

// ==================== 生成80-120字方义解读 ====================
function generateFormulaComment(herbs, primary, secondary, jczz) {
  const herbNames = herbs.map(h => h.name);
  const sorted = [...herbs].sort((a, b) => b.dose - a.dose);
  const totalDose = sorted.reduce((s, h) => s + h.dose, 0);

  // 君药信息
  const junNames = jczz.jun.herbs.map(h => h.name).join('、');
  const junAction = jczz.jun.herbs.map(h => h.功效.split('，')[0]).join('、');

  // 臣药信息
  const chenNames = jczz.chen.herbs.map(h => h.name).join('、');

  // 性味分析
  const natures = {};
  herbs.forEach(h => { natures[h.nature] = (natures[h.nature] || 0) + 1; });
  const dominantNature = Object.entries(natures).sort((a, b) => b[1] - a[1])[0];
  const natureDesc = {
    '寒': '寒凉清热', '微寒': '微寒清润', '凉': '清凉透散',
    '温': '温通散寒', '微温': '微温平和', '热': '大热峻补', '平': '性平和中'
  };
  const natureText = natureDesc[dominantNature[0]] || '性味平和';

  // 归经分析
  const meridians = {};
  herbs.forEach(h => h.meridians.forEach(m => { meridians[m] = (meridians[m] || 0) + 1; }));
  const topMeridians = Object.entries(meridians).sort((a, b) => b[1] - a[1]).slice(0, 2);
  const meridianText = topMeridians.map(([m]) => m + '经').join('、');

  // 主攻功效
  const primaryAction = getPrimaryAction(primary);

  // 构建解读文本
  let parts = [];

  // 开头：君药 + 主治
  parts.push(`${junNames}为君，${junAction}，直击病本`);

  // 臣药辅助
  if (chenNames) {
    parts.push(`${chenNames}为臣，协同增效`);
  }

  // 性味归经
  parts.push(`全方${natureText}，归${meridianText}`);

  // 整体功效
  parts.push(`共奏${primaryAction}之功`);

  // 适用方向
  const targetOrgans = getTargetOrgans(primary.herbs);
  parts.push(`偏治${targetOrgans}相关之证`);

  let comment = parts.join('，') + '。';

  // 确保80-120字
  if (comment.length < 80) {
    // 补充佐使药说明
    const zuoNames = jczz.zuo.herbs.map(h => h.name).join('、');
    const shiNames = jczz.shi.herbs.map(h => h.name).join('、');
    if (zuoNames) comment += `佐以${zuoNames}调和药性`;
    if (shiNames) comment += `，使以${shiNames}引经报使`;
    comment += '，使全方攻补有度，标本兼顾。';
  }

  if (comment.length > 120) {
    comment = comment.slice(0, 118) + '。';
  }

  return comment;
}

// ==================== UI 交互 ====================
function analyzeFormula() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) {
    alert('请先输入药材信息');
    return;
  }

  const herbs = parseInput(text);
  if (herbs.length === 0) {
    alert('未识别到药材，请检查输入格式。\n\n支持格式：黄芪 15g，当归 10g，白术 12克');
    return;
  }

  // Render herb list
  renderHerbList(herbs);

  // Generate analysis
  const analysis = generateFormulaAnalysis(herbs);
  if (analysis) {
    renderResult(analysis);
  }
}

function renderHerbList(herbs) {
  const section = document.getElementById('parsedSection');
  const list = document.getElementById('herbList');

  const natureClass = { '寒': 'nature-cold', '微寒': 'nature-cold', '凉': 'nature-cold',
    '温': 'nature-warm', '微温': 'nature-warm', '热': 'nature-hot', '平': 'nature-neutral' };

  list.innerHTML = herbs.map(h => `
    <div class="herb-item">
      <div class="herb-name">${h.name}</div>
      <div class="herb-meta">
        <span class="herb-dosage">${h.dose}g</span>
        <span class="herb-nature ${natureClass[h.nature] || 'nature-neutral'}">${h.nature}</span>
        <span>${h.group}</span>
      </div>
    </div>
  `).join('');

  section.classList.add('show');
}

function renderResult(analysis) {
  const section = document.getElementById('resultSection');
  document.getElementById('formulaName').textContent = analysis.name;
  document.getElementById('formulaEfficacy').textContent = analysis.efficacy;

  const body = document.getElementById('resultBody');
  body.innerHTML = '';

  // 方义解读（80-120字综合段）
  if (analysis.comment) {
    body.innerHTML += `
      <div class="result-card" style="border-left-color: var(--brown-light); background: linear-gradient(135deg, rgba(139,105,20,0.04), rgba(139,105,20,0.01));">
        <div class="result-card-title"><span class="icon" style="background:var(--brown-light)">义</span>方义解读</div>
        <p style="line-height:2; color:var(--ink); font-size:15px;">${analysis.comment}</p>
      </div>
    `;
  }

  // 君臣佐使
  const jczz = analysis.junChenZuoShi;
  let jczzHTML = '<div class="result-card">';
  jczzHTML += '<div class="result-card-title"><span class="icon">君</span>君药 — 主证所治</div>';
  jczzHTML += `<p>${jczz.jun.desc}</p></div>`;
  jczzHTML += '<div class="result-card">';
  jczzHTML += '<div class="result-card-title"><span class="icon">臣</span>臣药 — 辅助兼治</div>';
  jczzHTML += `<p>${jczz.chen.desc}</p></div>`;
  jczzHTML += '<div class="result-card">';
  jczzHTML += '<div class="result-card-title"><span class="icon">佐</span>佐药 — 佐助佐制</div>';
  jczzHTML += `<p>${jczz.zuo.desc}</p></div>`;
  jczzHTML += '<div class="result-card">';
  jczzHTML += '<div class="result-card-title"><span class="icon">使</span>使药 — 引经调和</div>';
  jczzHTML += `<p>${jczz.shi.desc}</p></div>`;
  body.innerHTML += jczzHTML;

  // 详细分析
  analysis.detailed.forEach(card => {
    body.innerHTML += `
      <div class="result-card">
        <div class="result-card-title">${card.title}</div>
        <p>${card.content}</p>
      </div>
    `;
  });

  // 提示
  body.innerHTML += `
    <div class="result-card" style="border-left-color: #e74c3c;">
      <div class="result-card-title" style="color:#e74c3c;">⚠ 使用提示</div>
      <p style="color:#666;">${analysis.warning}</p>
    </div>
  `;

  section.classList.add('show');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('parsedSection').classList.remove('show');
  document.getElementById('resultSection').classList.remove('show');
}

// Enter 键触发分析
document.getElementById('inputText').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.ctrlKey) {
    analyzeFormula();
  }
});
</script>
